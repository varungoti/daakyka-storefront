# Deploy AR try-on to Railway when RAILWAY_TOKEN is configured in repo secrets.
name: Deploy AR Try-On

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "services/ar-tryon/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Skip when Railway is not configured
        if: ${{ env.RAILWAY_TOKEN == '' }}
        run: echo "Railway token is not configured; AR deployment skipped."

      - uses: actions/checkout@v4
        if: ${{ env.RAILWAY_TOKEN != '' }}

      - name: Install Railway CLI
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: npm install -g @railway/cli

      - name: Deploy ar-tryon service
        if: ${{ env.RAILWAY_TOKEN != '' }}
        working-directory: services/ar-tryon
        run: railway up --service ar-tryon --detach
