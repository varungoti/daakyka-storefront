name: Storefront Verify

# F-075: `release-*` is listed so a release branch (release-hardening and
# its successors) is verified on every push, not only once it has merged
# into master/main. HEAD of release-hardening had never been CI-checked
# when this was missing.
on:
  push:
    branches: [main, master, staging, "release-*"]
  pull_request:
    branches: [main, master, staging, "release-*"]
  workflow_dispatch:
    inputs:
      probe_base_url:
        description: "Deployed URL for the live probe job, e.g. a Vercel preview or production URL. Leave empty to skip the probe."
        required: false
        type: string
      probe_expects_noindex:
        description: "Also require robots.txt to disallow crawling (--staging). Only for a staging or preview deployment, never production."
        required: false
        type: boolean
        default: false

# F-308: least privilege. Nothing here pushes, comments or publishes. The
# repository default is already read-only, but this file should not depend
# on that setting staying that way.
permissions:
  contents: read

# Shared across every job below so the database is always seeded with the
# same admin credentials the e2e specs then log in with. This value is
# CI-only — the same throwaway Postgres container is destroyed at the end
# of the job — and is deliberately NOT the documented local-dev default,
# so it can never be mistaken for (or double as) a real deploy's secret.
env:
  DATABASE_URL: "postgresql://daakyka:daakyka@localhost:5432/daakyka_dev"
  AUTH_SECRET: ci-test-auth-secret-min-32-chars-long
  ADMIN_SEED_EMAIL: ci-admin@example.com
  ADMIN_SEED_PASSWORD: ci-only-admin-password-not-a-real-secret
  # F-249: the root key for encrypted admin-saved credentials. Strict-mode env
  # validation and every credential-store write need it, and a CI runner has no
  # .env to supply one. CI-only (32 bytes of 0x01, base64) — never a real key,
  # and the throwaway database it encrypts for is destroyed with the job.
  CREDENTIAL_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: daakyka
          POSTGRES_PASSWORD: daakyka
          POSTGRES_DB: daakyka_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daakyka -d daakyka_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # F-308: no job pushes, so don't leave GITHUB_TOKEN in .git/config
          # for `npm ci` lifecycle scripts to read.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # release-hardening item 2 (section 6, docs/AUDIT_AND_UX_PLAN_2026-09-19.md):
      # --omit=dev means only advisories reachable from a real deploy's
      # `npm ci --omit=dev` can fail this step; dev-only tooling (Lighthouse
      # CI, Playwright, etc.) is excluded on purpose. Gated at "critical",
      # not "high": today's only --omit=dev findings are 4 HIGH-severity
      # advisories (deepmerge-ts stack exhaustion, mysql2 auth/DoS issues),
      # all transitive deps of the `prisma` CLI's MySQL-provider config
      # support — a code path this Postgres-only app never runs — with no
      # non-breaking fix yet (`npm audit fix --force` downgrades prisma to
      # 6.x). Gating at "high" would red every build for a finding that
      # isn't actionable without a real regression; "critical" still fails
      # the build immediately for the class of finding that matters most.
      # Revisit the threshold once prisma ships a fix, or reconsider moving
      # the `prisma` CLI package to devDependencies (build-time only, not
      # used by the running server) — both out of scope for this change.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Setup database
        run: npm run db:setup

      - name: Lint, typecheck, test, and build
        run: npm run verify

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: daakyka
          POSTGRES_PASSWORD: daakyka
          POSTGRES_DB: daakyka_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daakyka -d daakyka_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # F-308: no job pushes, so don't leave GITHUB_TOKEN in .git/config
          # for `npm ci` lifecycle scripts to read.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup database
        run: npm run db:setup

      # The application seed leaves every catalogue product in DRAFT, so the
      # browser specs (which open the first listed product, the shop grid and
      # the navigation) need a published catalogue in this throwaway database.
      # Mirrors scripts/local-ci-runner.mjs.
      - name: Publish disposable CI catalogue
        run: npm run db:seed:catalog -- --publish

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build and start server
        run: |
          npm run build
          npm run start &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          exit 1
        env:
          PORT: "3000"
          DISABLE_RATE_LIMIT: "1"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

      - name: Smoke tests
        run: npm run test:smoke
        env:
          TEST_BASE_URL: http://localhost:3000

      - name: Core E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Dogfood E2E tests
        run: npm run test:dogfood
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          DISABLE_RATE_LIMIT: "1"

      - name: Accessibility tests
        run: npm run test:a11y
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      # Reuses the server already built and started above rather than a
      # second full build — Lighthouse mobile scores are noisy on shared
      # runners, so lighthouserc.js gates performance at a floor measured
      # locally (see docs/PERFORMANCE.md), not yet the master-plan target of
      # 90; accessibility is gated at 90 to match the axe pass above.
      - name: Lighthouse CI (mobile)
        run: npm run test:lighthouse
        env:
          LHCI_BASE_URL: http://localhost:3000

  # F-075: this job used to probe the production URL with --staging, which
  # requires robots.txt to disallow crawling. It passed only while production
  # was deliberately noindexed and would have started failing the moment
  # indexing was switched on at launch. The target is now an explicit input
  # and --staging is opt-in.
  live-probe:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.probe_base_url != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # F-308: no job pushes, so don't leave GITHUB_TOKEN in .git/config
          # for `npm ci` lifecycle scripts to read.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe deployed site
        # Inputs reach the shell only through env, never interpolated into
        # the script text.
        run: |
          if [ "$PROBE_EXPECTS_NOINDEX" = "true" ]; then
            npm run probe:deploy -- --staging
          else
            npm run probe:deploy
          fi
        env:
          TEST_BASE_URL: ${{ inputs.probe_base_url }}
          PROBE_EXPECTS_NOINDEX: ${{ inputs.probe_expects_noindex }}
