name: Storefront Verify

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]
  workflow_dispatch:

# Shared across every job below so the database is always seeded with the
# same admin credentials the e2e specs then log in with. This value is
# CI-only — the same throwaway Postgres container is destroyed at the end
# of the job — and is deliberately NOT the documented local-dev default,
# so it can never be mistaken for (or double as) a real deploy's secret.
env:
  DATABASE_URL: "postgresql://daakyka:daakyka@localhost:5432/daakyka_dev"
  AUTH_SECRET: ci-test-auth-secret-min-32-chars-long
  ADMIN_SEED_EMAIL: ci-admin@example.com
  ADMIN_SEED_PASSWORD: ci-only-admin-password-not-a-real-secret

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: daakyka
          POSTGRES_PASSWORD: daakyka
          POSTGRES_DB: daakyka_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daakyka -d daakyka_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # release-hardening item 2 (section 6, docs/AUDIT_AND_UX_PLAN_2026-09-19.md):
      # --omit=dev means only advisories reachable from a real deploy's
      # `npm ci --omit=dev` can fail this step; dev-only tooling (Lighthouse
      # CI, Playwright, etc.) is excluded on purpose. Gated at "critical",
      # not "high": today's only --omit=dev findings are 4 HIGH-severity
      # advisories (deepmerge-ts stack exhaustion, mysql2 auth/DoS issues),
      # all transitive deps of the `prisma` CLI's MySQL-provider config
      # support — a code path this Postgres-only app never runs — with no
      # non-breaking fix yet (`npm audit fix --force` downgrades prisma to
      # 6.x). Gating at "high" would red every build for a finding that
      # isn't actionable without a real regression; "critical" still fails
      # the build immediately for the class of finding that matters most.
      # Revisit the threshold once prisma ships a fix, or reconsider moving
      # the `prisma` CLI package to devDependencies (build-time only, not
      # used by the running server) — both out of scope for this change.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Setup database
        run: npm run db:setup

      - name: Lint, typecheck, test, and build
        run: npm run verify

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: daakyka
          POSTGRES_PASSWORD: daakyka
          POSTGRES_DB: daakyka_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daakyka -d daakyka_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup database
        run: npm run db:setup

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build and start server
        run: |
          npm run build
          npm run start &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          exit 1
        env:
          PORT: "3000"
          DISABLE_RATE_LIMIT: "1"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

      - name: Smoke tests
        run: npm run test:smoke
        env:
          TEST_BASE_URL: http://localhost:3000

      - name: Core E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Dogfood E2E tests
        run: npm run test:dogfood
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          DISABLE_RATE_LIMIT: "1"

      - name: Accessibility tests
        run: npm run test:a11y
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      # Reuses the server already built and started above rather than a
      # second full build — Lighthouse mobile scores are noisy on shared
      # runners, so lighthouserc.js gates performance at a floor measured
      # locally (see docs/PERFORMANCE.md), not yet the master-plan target of
      # 90; accessibility is gated at 90 to match the axe pass above.
      - name: Lighthouse CI (mobile)
        run: npm run test:lighthouse
        env:
          LHCI_BASE_URL: http://localhost:3000

  staging-probe:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe live staging
        run: npm run probe:deploy -- --staging
        env:
          TEST_BASE_URL: https://storefront-nu-woad.vercel.app
